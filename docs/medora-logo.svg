<svg width="200" height="56" viewBox="0 0 200 56" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Icon mark: rounded square with teal background -->
  <rect width="56" height="56" rx="14" fill="#0f9b8e"/>

  <!-- Medical cross (subtle, behind) -->
  <rect x="24.5" y="11" width="7" height="21" rx="3.5" fill="white" fill-opacity="0.18"/>
  <rect x="14" y="21" width="28" height="7" rx="3.5" fill="white" fill-opacity="0.18"/>

  <!-- Heartbeat / ECG line -->
  <polyline
    points="9,33 16,33 20,22 24,40 28,14 33,36 37,28 41,28 47,28"
    stroke="white"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Wordmark -->
  <!-- "Med" in navy -->
  <text
    x="70"
    y="38"
    font-family="'Sora', 'Helvetica Neue', Arial, sans-serif"
    font-weight="700"
    font-size="28"
    letter-spacing="-0.5"
    fill="#0d2137"
  >Med</text>

  <!-- "ora" in teal -->
  <text
    x="124"
    y="38"
    font-family="'Sora', 'Helvetica Neue', Arial, sans-serif"
    font-weight="700"
    font-size="28"
    letter-spacing="-0.5"
    fill="#0f9b8e"
  >ora</text>
</svg>
