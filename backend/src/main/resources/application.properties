spring.application.name=medora-backend

# ─── Database ───────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/medora_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=balsem1234!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ─── Server ─────────────────────────────────────────────────
server.port=8080
server.error.include-message=always

# ─── JWT ────────────────────────────────────────────────────
medora.jwt.secret=MedoraSecretKey2024!@#HealthcareManagementSystemSuperSecretKeyForJWT
medora.jwt.expiration=86400000

# ─── CORS ───────────────────────────────────────────────────
medora.cors.allowed-origins=http://localhost:3000

# ─── Logging ────────────────────────────────────────────────
logging.level.com.medora=INFO
logging.level.org.springframework.security=WARN
